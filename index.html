<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ti Kouloir - Street food à Grand Baie, Maurice</title>
<meta name="description" content="Ti Kouloir, le petit couloir de Grand Baie : mines frites, boulettes et dumplings maison. Ouvert du lundi au samedi, 11h-17h30.">
<style>
:root{--bois:#2b1a10;--piment:#b8261a;--sesame:#e8a23a;--creme:#f6ecd9;--encre:#24150d}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--creme);color:var(--encre);line-height:1.6}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif}

.hero{min-height:78vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:60px max(24px,8vw);color:#fff;
  background:linear-gradient(90deg,rgba(30,12,5,.88) 0%,rgba(30,12,5,.55) 60%,rgba(30,12,5,.25) 100%),url('images/bandeau.jpg') center/cover no-repeat,var(--bois)}
.hero h1{font-size:clamp(3rem,10vw,6.5rem);line-height:1;font-weight:700;letter-spacing:-1px}
.hero p{font-size:1.2rem;max-width:30ch;margin:16px 0 30px;color:#f3dfc0}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:14px 26px;border-radius:6px;text-decoration:none;font-weight:700;border:2px solid var(--sesame)}
.btn.plein{background:var(--sesame);color:var(--bois)}
.btn.vide{color:#fff}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}

section{max-width:1000px;margin:0 auto;padding:64px 22px}
h2{font-size:clamp(1.8rem,5vw,2.6rem);color:var(--piment);margin-bottom:8px}
.sous{margin-bottom:32px;opacity:.8}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px}
.plat img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:4px;background:var(--bois)}
.plat h3{font-size:1.4rem;margin:14px 0 2px}
.plat p{margin-bottom:4px}
.prix{color:var(--piment);font-weight:700}
.note{margin-top:22px;font-size:.9rem;opacity:.7}

.avis{background:var(--bois);color:var(--creme);max-width:none}
